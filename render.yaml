# Free trial: Render uses an ephemeral filesystem.
# Use a persistent disk or durable external database for real user data.
services:
  - type: web
    name: kasanie-football
    runtime: node
    repo: https://github.com/krasikovaanna1303-afk/myfootballapp
    branch: codex/kasanie-web
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/kasanie.sqlite
